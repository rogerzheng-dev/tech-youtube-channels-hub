{% extends "base.html" %}

{% block title %}Add Review{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h2 class="mb-3">Add Review</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit Review</button>
            </form>
        </div>
    </div>
{% endblock %}
