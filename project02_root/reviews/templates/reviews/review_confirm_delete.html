{% extends "base.html" %}

{% block title %}Delete Review{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h2 class="mb-3">Delete Review</h2>
            <p>Are you sure you want to delete this review?</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'channel_detail' review.channel.slug %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
