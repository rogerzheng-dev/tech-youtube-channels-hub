{% extends "base.html" %}

{% block title %}Add Channel{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h2 class="mb-3">Add New Channel</h2>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
{% endblock %}
