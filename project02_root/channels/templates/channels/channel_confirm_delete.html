{% extends "base.html" %}

{% block title %}Delete {{ channel.name }}{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h2 class="mb-3">Delete Channel</h2>
            <p>Are you sure you want to delete <strong>{{ channel.name }}</strong>?</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'channel_detail' channel.slug %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
